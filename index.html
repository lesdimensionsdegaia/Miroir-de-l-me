<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Codex Universel : Miroir de l'Âme Absolu</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Quicksand:wght@300;500&display=swap" rel="stylesheet">
<style>
:root { --gold: #d4af37; --deep-blue: #050a15; --parchment: #f4e4bc; }
body { background: var(--deep-blue); color: var(--parchment); font-family: 'Quicksand', sans-serif; margin: 0; overflow-x: hidden; }
canvas { position: fixed; top: 0; left: 0; z-index: -1; }
.container { max-width: 900px; margin: 40px auto; padding: 20px; position: relative; }
.card { background: rgba(10, 20, 40, 0.9); border: 2px solid var(--gold); padding: 40px; border-radius: 15px; box-shadow: 0 0 30px rgba(212, 175, 55, 0.2); }
h1, h2, h3 { font-family: 'Cinzel Decorative', cursive; color: var(--gold); text-align: center; }
.input-group { margin-bottom: 20px; }
input, select, textarea { width: 100%; padding: 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--gold); color: white; border-radius: 5px; }
.btn-ritual { width: 100%; padding: 15px; background: var(--gold); color: var(--deep-blue); font-weight: bold; cursor: pointer; border: none; font-family: 'Cinzel Decorative'; transition: 0.3s; }
.btn-ritual:hover { background: #fff; box-shadow: 0 0 20px var(--gold); }
.result-section { display: none; margin-top: 30px; line-height: 1.8; text-align: justify; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
.mini-card { border: 1px solid rgba(212, 175, 55, 0.3); padding: 15px; border-radius: 10px; background: rgba(0,0,0,0.3); }
hr { border: 0; border-top: 1px solid var(--gold); margin: 30px 0; opacity: 0.5; }
@media print { .no-print { display: none; } body { background: white; color: black; } .card { border: none; } }
</style>
</head>
<body>
<canvas id="stars"></canvas>

<div class="container">
    <div class="card no-print" id="input-card">
        <h1>Le Codex Universel</h1>
        <p style="text-align:center">Entrez vos coordonnées vibratoires pour décoder votre existence.</p>
        <div class="grid">
            <div class="input-group"><input type="text" id="prenom" placeholder="Votre Prénom"></div>
            <div class="input-group"><input type="text" id="nom" placeholder="Votre Nom"></div>
        </div>
        <div class="input-group"><input type="date" id="dob"></div>
        <div class="input-group">
            <select id="tradition">
                <option value="all">Toutes les traditions (Synthèse Globale)</option>
            </select>
        </div>
        <button class="btn-ritual" onclick="analyser()">Lancer l'Analyse Sacrée</button>
    </div>

    <div id="resultat" class="result-section">
        <div class="card">
            <div id="output-header"></div>
            <hr>
            <div id="output-etymologie"></div>
            <hr>
            <div id="output-numerologie"></div>
            <hr>
            <div id="output-traditions"></div>
            <hr>
            <div id="output-esprits"></div>
            <hr>
            <div id="output-conclusion"></div>
            <button class="btn-ritual no-print" style="margin-top:20px" onclick="window.print()">Sauvegarder mon Codex</button>
        </div>
    </div>
</div>

<script>
// --- LOGIQUE NUMEROLOGIQUE & ETYMOLOGIQUE ---
const ALPHA = { a:1, b:2, c:3, d:4, e:5, f:6, g:7, h:8, i:9, j:1, k:2, l:3, m:4, n:5, o:6, p:7, q:8, r:9, s:1, t:2, u:3, v:4, w:5, x:6, y:7, z:8 };

function getNum(str) {
    let sum = str.toLowerCase().split('').reduce((acc, char) => acc + (ALPHA[char] || 0), 0);
    return sum;
}

function reduire(n, master=true) {
    if (master && (n === 11 || n === 22 || n === 33)) return n;
    while (n > 9) { n = n.toString().split('').reduce((a,b) => a + parseInt(b), 0); }
    return n;
}

function getEtymologie(prenom) {
    // Simule une base de données étymologique
    const p = prenom.toLowerCase();
    if(p.includes('a')) return "Racine Solaire : Signifie la Lumière ou le Commencement. Dans la tradition celte, évoque l'éveil de la nature.";
    if(p.includes('el')) return "Racine Céleste : 'El' fait référence au Divin (Angélique). Porteur de la parole des messagers.";
    return "Racine Terrestre : Liée à la stabilité, au nomade qui devient bâtisseur.";
}

function analyser() {
    const prenom = document.getElementById('prenom').value;
    const nom = document.getElementById('nom').value;
    const dob = document.getElementById('dob').value;
    if (!prenom || !dob) return alert("Veuillez remplir les champs.");

    const date = new Date(dob);
    const j = date.getDate(), m = date.getMonth()+1, a = date.getFullYear();
    
    // Calculs
    const cheminVie = reduire(j + m + reduire(a, false));
    const expression = reduire(getNum(prenom) + getNum(nom));
    const angeNum = (j * m).toString().padStart(3, '0'); // Code Angélique simplifié

    // Remplissage HTML
    document.getElementById('output-header').innerHTML = `
        <h1>Portrait Sacré de ${prenom} ${nom}</h1>
        <p style="text-align:center">Né(e) le ${j}/${m}/${a} — Coordonnées Terrestres Actives</p>
    `;

    document.getElementById('output-etymologie').innerHTML = `
        <h2>I. Étymologie & Puissance du Nom</h2>
        <p><strong>Origine du Prénom :</strong> ${getEtymologie(prenom)}</p>
        <p><strong>Dans les Traditions :</strong> Pour les <strong>Amérindiens</strong>, votre nom vibre comme un écho de votre totem. Chez les <strong>Celtes</strong>, il porte l'Ogham (l'alphabet des arbres) de la protection. Votre nom de famille, <strong>${nom}</strong>, agit comme votre "Ancrage Ancestral", transmettant le Karma des ancêtres vers votre Dharma personnel.</p>
    `;

    document.getElementById('output-numerologie').innerHTML = `
        <h2>II. Les Mathématiques de l'Invisible</h2>
        <div class="grid">
            <div class="mini-card"><strong>Chemin de Vie : ${cheminVie}</strong><br>Votre destin mathématique. C'est la route tracée dans les étoiles.</div>
            <div class="mini-card"><strong>Nombre des Anges : ${angeNum}</strong><br>Séquence de protection. Les anges utilisent ce code pour attirer votre attention.</div>
        </div>
        <p><em>Note :</em> Votre numérologie 11, 22 ou 33 (si présente) indique une "Âme Maîtresse" venue pour une mission collective.</p>
    `;

    document.getElementById('output-traditions').innerHTML = `
        <h2>III. Calendriers du Monde</h2>
        <div class="grid">
            <div class="mini-card"><strong>Maya :</strong> Signe du 'Lamat' (L'Étoile) - Porteur de beauté.</div>
            <div class="mini-card"><strong>Chinois :</strong> Cycle lié à l'élément de votre année de naissance.</div>
            <div class="mini-card"><strong>Musulman :</strong> Correspondance Lunaire - Votre sensibilité est fluide.</div>
            <div class="mini-card"><strong>Maori :</strong> Le 'Mana' qui émane de votre nom renforce votre autorité spirituelle.</div>
        </div>
    `;

    document.getElementById('output-esprits').innerHTML = `
        <h2>IV. Esprits & Guides</h2>
        <p><strong>Esprit de la Nature proche :</strong> Le <strong>Gardien du Seuil</strong> (Esprit celte des forêts). Il vous accompagne dès que vous marchez sur une terre sauvage.</p>
        <p><strong>Esprit Céleste :</strong> L'Archange de votre rayon de naissance. Il filtre les énergies pour ne laisser passer que ce qui sert votre évolution.</p>
    `;

    document.getElementById('output-conclusion').innerHTML = `
        <h2>Conclusion du Codex</h2>
        <p style="font-style:italic">"L'univers n'est pas fait d'atomes, il est fait d'histoires. ${prenom}, votre histoire est inscrite dans les mathématiques, les mythes et le sang de vos ancêtres. Que ce miroir vous aide à marcher avec la certitude d'un roi/reine sur son propre royaume."</p>
    `;

    document.getElementById('input-card').style.display = 'none';
    document.getElementById('resultat').style.display = 'block';
}

// Animation étoiles
const canvas = document.getElementById('stars');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
const particles = [];
for(let i=0; i<150; i++) particles.push({x: Math.random()*canvas.width, y: Math.random()*canvas.height, s: Math.random()*2});
function anim() {
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "white";
    particles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.s, 0, Math.PI*2);
        ctx.fill();
        p.y += 0.3; if(p.y > canvas.height) p.y = 0;
    });
    requestAnimationFrame(anim);
}
anim();
</script>
</body>
</html>
